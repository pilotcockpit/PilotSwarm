<title>PilotSwarm Flight Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
<style>
/* Layout: labelled rail · area top bar · content. Session = chat column + companion pane (Canvas · Files · Agents · Activity).
   Flight Deck: neutral cockpit, colour reserved for agent state, one blue accent, Recursive with a MONO axis for data. */
:root {
  color-scheme: light;
  --bg: #f6f7f8; --surface: #ffffff; --raised: #eff1f3; --overlay: #ffffff;
  --line: #e3e5e8; --line-subtle: #eef0f2; --line-strong: #c3c7cd;
  --fg: #111214; --muted: #565a61; --faint: #6a6e75;
  --accent: #1d6ae0; --accent-fg: #ffffff; --accent-tint: #e7effc;
  --live: #0b7d6c; --waiting: #94610a; --failed: #c42d3a; --ok: #1e7b4f; --need: #1d6ae0;
  --live-tint: #e3f5f1; --waiting-tint: #fbf1dc; --failed-tint: #fdeaec; --ok-tint: #e2f4ea;
  --shadow: 0 8px 24px rgb(16 18 20 / .12);
  --sans: "Recursive", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Recursive", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-chip: 4px; --r-control: 6px; --r-pane: 8px; --r-dialog: 10px;
  --row: 30px; --control: 30px; --ease: cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0f11; --surface: #141518; --raised: #1b1c20; --overlay: #202126;
    --line: #26272c; --line-subtle: #1d1e22; --line-strong: #3a3b42;
    --fg: #ececee; --muted: #a1a3ab; --faint: #8b8d95;
    --accent: #5c9dff; --accent-fg: #0e0f11; --accent-tint: #172238;
    --live: #3ec7b0; --waiting: #e2a93b; --failed: #f2666f; --ok: #57c785; --need: #5c9dff;
    --live-tint: #12302b; --waiting-tint: #2e2514; --failed-tint: #33181c; --ok-tint: #15291e;
    --shadow: 0 8px 24px rgb(0 0 0 / .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f11; --surface: #141518; --raised: #1b1c20; --overlay: #202126;
  --line: #26272c; --line-subtle: #1d1e22; --line-strong: #3a3b42;
  --fg: #ececee; --muted: #a1a3ab; --faint: #8b8d95;
  --accent: #5c9dff; --accent-fg: #0e0f11; --accent-tint: #172238;
  --live: #3ec7b0; --waiting: #e2a93b; --failed: #f2666f; --ok: #57c785; --need: #5c9dff;
  --live-tint: #12302b; --waiting-tint: #2e2514; --failed-tint: #33181c; --ok-tint: #15291e;
  --shadow: 0 8px 24px rgb(0 0 0 / .45);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 13px; line-height: 20px;
  font-variation-settings: "MONO" 0, "CASL" 0;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, code, kbd, .id, .num { font-family: var(--mono); font-variation-settings: "MONO" 1, "CASL" 0; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 18px; line-height: 24px; font-weight: 650; }
h2 { font-size: 14px; line-height: 20px; font-weight: 650; }
h3 { font-size: 13px; line-height: 20px; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Shell ─────────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 228px 1fr; height: 100%; }
.rail {
  display: flex; flex-direction: column; gap: 4px; min-height: 0;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 12px 10px 10px; padding-left: max(10px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; }
.brand-mark { width: 24px; height: 24px; flex: none; }
.brand-name { font-weight: 700; font-size: 14px; letter-spacing: .01em; }
.brand-env { margin-left: auto; font-size: 11px; color: var(--faint); }
.btn-new {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; margin-bottom: 10px;
  border: 0; border-radius: var(--r-control); background: var(--accent); color: var(--accent-fg); font-weight: 600;
}
.btn-new:hover { filter: brightness(1.06); }
.btn-new kbd { font-size: 11px; opacity: .8; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-label { font-size: 12px; color: var(--faint); padding: 14px 8px 4px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px;
  border-radius: var(--r-control); color: var(--muted); text-decoration: none;
}
.nav a:hover { background: var(--raised); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--raised); color: var(--fg); font-weight: 600; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: var(--accent); }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 600; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; display: grid; place-items: center; }
.count.need { background: var(--accent); color: var(--accent-fg); }
.count.plain { background: var(--raised); color: var(--muted); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.me { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-tint); color: var(--accent); flex: none; }
.conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; flex: none;
  border-bottom: 1px solid var(--line); background: var(--surface);
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); }
.crumbs b { color: var(--fg); font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search {
  margin-left: auto; display: flex; align-items: center; gap: 8px; width: min(340px, 34vw); height: 32px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: var(--r-control); background: var(--bg); color: var(--faint);
}
.search:hover { border-color: var(--line-strong); }
.search span { flex: 1; text-align: left; }
kbd { font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; background: transparent; border-radius: var(--r-control); color: var(--muted); }
.icon-btn:hover { background: var(--raised); color: var(--fg); }
.content { flex: 1; min-height: 0; overflow: auto; }
.page { max-width: 1180px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-direction: column; gap: 28px; }

/* ── Controls ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: var(--control); padding: 0 12px; white-space: nowrap;
  border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); font-weight: 550;
}
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--raised); color: var(--fg); }
.btn.danger { color: var(--failed); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12px; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--fg); background: var(--accent-tint); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r-chip); background: var(--raised); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); }
.field input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; }
.section-head { display: flex; align-items: baseline; gap: 10px; }
.section-head .count-text { color: var(--faint); }
.section-head .act { margin-left: auto; }

/* ── State: glyph + word + colour, never colour alone ──────────────── */
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 550; white-space: nowrap; }
.st svg { width: 12px; height: 12px; flex: none; }
.st.live { color: var(--live); } .st.waiting { color: var(--waiting); } .st.failed { color: var(--failed); }
.st.need { color: var(--need); } .st.idle, .st.done { color: var(--muted); } .st.ok { color: var(--ok); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.live { background: var(--live-tint); color: var(--live); }
.pill.waiting { background: var(--waiting-tint); color: var(--waiting); }
.pill.failed { background: var(--failed-tint); color: var(--failed); }
.pill.need { background: var(--accent-tint); color: var(--need); }
.pill.idle, .pill.done { background: var(--raised); color: var(--muted); }
.pill .why { font-weight: 450; color: var(--fg); opacity: .85; }
@keyframes pulse { 50% { opacity: .35; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } * { transition: none !important; } }

/* Durable spine: last 16 events as ticks */
.spine { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex: none; }
.spine i { width: 2px; height: 6px; border-radius: 1px; background: var(--line-strong); }
.spine i.l { background: var(--live); height: 9px; } .spine i.w { background: var(--waiting); height: 6px; }
.spine i.f { background: var(--failed); height: 12px; } .spine i.d { background: var(--muted); }

/* ── Lists and tables ──────────────────────────────────────────────── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pane); overflow: hidden; }
.rows > * + * { border-top: 1px solid var(--line-subtle); }
.row { display: grid; align-items: center; gap: 14px; min-height: 52px; padding: 10px 16px; }
.row:hover { background: color-mix(in srgb, var(--raised) 60%, transparent); }
.row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.need-row { grid-template-columns: 22px 1fr auto; }
.need-row .q { color: var(--fg); }
table.t { width: 100%; border-collapse: collapse; font-size: inherit; line-height: inherit; color: inherit; }
.t th { text-align: left; font-size: 12px; font-weight: 550; color: var(--muted); padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 0 14px; height: 40px; border-bottom: 1px solid var(--line-subtle); white-space: nowrap; }
.t tr:last-child td { border-bottom: 0; }
.t td.num, .t th.num { text-align: right; }
.scroll-x { overflow-x: auto; }
.meter { position: relative; width: 120px; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; display: inline-block; vertical-align: middle; }
.meter b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.meter.warn b { background: var(--waiting); }

/* Home */
.greet { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.greet p { color: var(--muted); }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.kpi { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.kpi b { font-variant-numeric: tabular-nums; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.run-row { grid-template-columns: 14px minmax(0, 1fr) auto; }
.sched-row { grid-template-columns: 56px minmax(0, 1fr) auto; }
.when { font-family: var(--mono); font-variation-settings: "MONO" 1; font-variant-numeric: tabular-nums; font-size: 12px; line-height: 16px; color: var(--fg); }
.when small { display: block; color: var(--faint); font-size: 11px; }
.outputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.out { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-pane); background: var(--surface); text-align: left; min-width: 0; }
.out:hover { border-color: var(--line-strong); }
.thumb { aspect-ratio: 16/10; max-width: 100%; border-radius: 6px; background: var(--raised); overflow: hidden; display: grid; place-items: center; color: var(--faint); }
.out .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sessions list */
.sess-row { grid-template-columns: 20px minmax(0, 2.2fr) minmax(0, 1.1fr) minmax(0, 1.3fr) 90px 76px; cursor: pointer; }
.sess-row.child { padding-left: 46px; grid-template-columns: 20px minmax(0, 2.2fr) minmax(0, 1.1fr) minmax(0, 1.3fr) 90px 76px; }
.group-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 600; }
.cb { width: 16px; height: 16px; border: 1.5px solid var(--line-strong); border-radius: 4px; display: inline-block; }
.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--r-pane); background: var(--overlay); border: 1px solid var(--line); box-shadow: var(--shadow); }

/* ── Session ───────────────────────────────────────────────────────── */
.session { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.s-head { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.s-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 360px; }
.s-title h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-meta { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.s-meta .sep { color: var(--line-strong); }
.s-actions { display: flex; align-items: center; gap: 8px; }
.s-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(380px, 1fr) 6px minmax(420px, 1.15fr); }
.s-body.solo { grid-template-columns: 1fr; }
.s-body.solo .chat .transcript, .s-body.solo .chat .composer-wrap { width: 100%; max-width: 900px; margin: 0 auto; }
.views-solo button { display: inline-flex; align-items: center; gap: 6px; }
.s-body.solo .gutter, .s-body.solo .companion { display: none; }
.s-body.wide { grid-template-columns: 0 0 1fr; }
.s-body.wide .chat { visibility: hidden; }
.gutter { background: var(--line); cursor: col-resize; position: relative; }
.gutter::after { content: ""; position: absolute; inset: 0 -3px; }
.chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
.transcript { flex: 1; overflow: auto; padding: 20px 24px 12px; display: flex; flex-direction: column; gap: 14px; }
.msg-user { align-self: flex-end; max-width: 78%; background: var(--raised); border-radius: 10px 10px 2px 10px; padding: 10px 14px; font-size: 14px; line-height: 22px; }
.msg-user .who { font-size: 11.5px; color: var(--faint); margin-bottom: 2px; }
.msg-agent { display: flex; gap: 10px; max-width: 72ch; }
.msg-agent .body { font-size: 14px; line-height: 22px; display: flex; flex-direction: column; gap: 8px; }
.agent-badge { width: 24px; height: 24px; border-radius: 6px; flex: none; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.tool {
  border: 1px solid var(--line); border-radius: var(--r-pane); background: var(--surface); overflow: hidden; max-width: 72ch;
}
.tool summary { list-style: none; display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; height: 34px; padding: 0 12px; cursor: pointer; }
.tool summary::-webkit-details-marker { display: none; }
.tool .tname { font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 12px; }
.tool .targ { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .dur { font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tool pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line-subtle); background: var(--bg); font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 12px; line-height: 18px; overflow-x: auto; color: var(--muted); }
.kids { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 10px; border-top: 1px solid var(--line-subtle); }
.kid { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; }
.card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-pane); background: var(--surface); max-width: 72ch; }
.card .ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--raised); color: var(--muted); flex: none; }
.card .tx { flex: 1; min-width: 0; }
.card .tx b { display: block; }
.card .tx span { color: var(--muted); font-size: 12px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-chip); background: var(--surface); border: 1px solid var(--line); font-size: 12px; }
.err { border: 1px solid color-mix(in srgb, var(--failed) 35%, var(--line)); background: var(--failed-tint); border-radius: var(--r-pane); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 72ch; }
.err .lead { display: flex; gap: 8px; color: var(--fg); }
.err .lead svg { color: var(--failed); margin-top: 2px; }
.err details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.err pre { white-space: pre-wrap; font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.ask { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-tint); border-radius: var(--r-pane); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; max-width: 72ch; }
.ask .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.daymark { align-self: center; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.composer-wrap { padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.queued { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-control); font-size: 12px; color: var(--muted); }
.queued b { color: var(--fg); font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer { border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

    ['Go to', [['boards', 'Board: Release 0.8.8', ''], ['providers', 'Providers', 'G P'], ['sun', 'Change theme', '']]],
  ];
  let k = 0;
  openLayer(`<div class="scrim" data-close><div class="dialog palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="field">${ic('search')}<input autofocus aria-label="Type a command or search" placeholder="Type a command, or search sessions, agents, canvases…"></div>
    <div class="dialog-body" style="padding:4px 0 8px;gap:0" role="listbox">${groups.map(([g, items]) => `<div class="pgroup"><h4>${g}</h4>${items.map(([i, l, h]) => `<button class="pitem" role="option" aria-selected="${k++ === 0}">${ic(i)}${l}${h ? (h.length < 4 ? `<kbd>${h}</kbd>` : `<span class="faint" style="margin-left:auto;font-size:12px">${h}</span>`) : ''}</button>`).join('')}</div>`).join('')}</div>
    <div class="dialog-foot"><span class="grow">↑↓ to move · Enter to run · ? for all shortcuts</span></div>
  </div></div>`);
}
function share(canvas) {
  openLayer(`<div class="scrim" data-close><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sh-t" style="width:min(560px,100%)">
    <div class="dialog-head"><h1 id="sh-t">${canvas ? 'Share “Release checklist”' : 'Share session'}</h1><span style="flex:1"></span><button class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="dialog-body">
      ${canvas ? `<div class="stack" style="gap:8px"><h3>Who can open the link</h3>
        <div class="radio-row" aria-checked="true" role="radio"><span class="radio"></span><div><b>People with access to the session</b><div class="muted" style="font-size:12px">Signed-in link that opens this canvas full screen.</div></div></div>
        <div class="radio-row" aria-checked="false" role="radio"><span class="radio"></span><div><b>Anyone with the link</b><div class="muted" style="font-size:12px">No sign-in, read-only. You can turn the link off at any time.</div></div></div></div>
        <div class="stack" style="gap:8px"><h3>Who can tick items inside this app</h3><button class="select">People who can write to the session ${ic('down')}</button></div>`
      : `<div class="stack" style="gap:8px"><h3>General access</h3><button class="select">${ic('lock')} Private: only you and admins ${ic('down')}</button></div>
        <div class="stack" style="gap:8px"><h3>People</h3><div class="field">${ic('users')}<input placeholder="Add people by name or email"></div>
        <div class="panel rows"><div class="row" style="grid-template-columns:auto 1fr auto;min-height:44px"><span class="avatar">RK</span><span>Rae Kim</span><button class="select" style="height:28px">Can read ${ic('down')}</button></div></div>
        <p class="muted" style="font-size:12px">Sharing covers this session and its 3 sub-agents.</p></div>`}
    </div>
    <div class="dialog-foot"><button class="btn">${ic('link')}Copy link</button><span class="grow"></span><button class="btn primary" data-close>Done</button></div>
  </div></div>`);
}
function sessionMenu(btn) {
  const r = btn.getBoundingClientRect();
  openLayer(`<div class="scrim" data-close style="background:transparent;display:block;padding:0"></div><div class="menu" role="menu" aria-label="Session actions" style="top:${r.bottom + 6}px;left:${Math.max(8, r.right - 248)}px">
    <button role="menuitem">${ic('edit')}Rename</button><button role="menuitem">${ic('pin')}Unpin</button><button role="menuitem">${ic('folder')}Move to group…</button>
    <button role="menuitem">${ic('agents')}Change model…</button><button role="menuitem">${ic('git')}Working folder…</button><button role="menuitem">${ic('refresh')}Regenerate context…</button>
    <button role="menuitem">${ic('link')}Copy link</button><button role="menuitem">${ic('download')}Export history</button>
    <hr><button role="menuitem">${ic('check')}Complete</button><div class="note">Also completes 2 running sub-agents</div>
    <button role="menuitem">${ic('x')}Cancel session</button><button role="menuitem" class="danger">${ic('alert')}Delete…</button>
  </div>`);
}

/* ── Wiring ────────────────────────────────────────────────────────── */
function render() {
  renderNav();
  const h = location.hash.replace(/^#\/?/, '');
  closeLayer();
  if (!h) home();
  else if (h.startsWith('s/')) session(h.slice(2));
  else ({ sessions, boards, outputs, library, providers, admin, settings }[h.split('/')[0]] || home)();
  document.getElementById('content').scrollTop = 0;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-open],[data-close],[data-go],[data-pane],[data-slot],[data-filter],[data-admin],[data-theme-pick],#select-toggle,#s-menu,#wide-toggle,#theme-toggle');
  if (!t) return;
  if (t.matches('[data-close]') && (e.target === t || t.tagName === 'BUTTON' || t.tagName === 'A')) { closeLayer(); return; }
  const o = t.dataset.open;
  if (o === 'new') { e.preventDefault(); newSession(); }
  else if (o === 'palette') palette();
  else if (o === 'share') share(false);
  else if (o === 'share-canvas') share(true);
  else if (t.dataset.go) location.hash = t.dataset.go;
  else if (t.dataset.pane) {
    if (t.dataset.pane === 'chat') { state.paneOpen = false; } else { state.pane = t.dataset.pane; state.paneOpen = true; state.slot = 0; state.openFor = (location.hash.match(/^#\/s\/([^/]+)/) || [])[1]; }
    state.wide = false; render();
  }
  else if (t.dataset.slot) { state.slot = +t.dataset.slot; render(); }
  else if (t.dataset.filter) { state.filter = t.dataset.filter; render(); }
  else if (t.dataset.admin) { e.preventDefault(); state.adminTab = t.dataset.admin; render(); }
  else if (t.dataset.themePick !== undefined) { const v = t.dataset.themePick; if (v === 'x') return; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; render(); }
  else if (t.id === 'select-toggle') { state.selecting = !state.selecting; render(); }
  else if (t.id === 's-menu') sessionMenu(t);
  else if (t.id === 'wide-toggle') { state.wide = !state.wide; render(); }
  else if (t.id === 'theme-toggle') {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; render();
  }
});
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette(); }
  else if (e.key === 'Escape') { if (document.getElementById('layer').innerHTML) closeLayer(); else if (state.wide) { state.wide = false; render(); } }
  else if (!typing && e.key === 'n') { e.preventDefault(); newSession(); }
  else if (!typing && e.key === 'Enter' && document.activeElement?.dataset.go) location.hash = document.activeElement.dataset.go;
});
addEventListener('hashchange', render);
render();
</script>
