    <script>
      // Apply the theme before first paint so there is no flash. Nothing chosen means System: follow the
      // operating system. A stored explicit choice (light or dark) always wins.
      function paintTheme(dark) {
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector?.('meta[name="theme-color"]')?.setAttribute("content", dark ? "#0e0f11" : "#f6f7f8");
      }
      try {
        var t = localStorage.getItem("fd.theme") || "system";
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        paintTheme(dark);
      } catch (e) {
        try { paintTheme(matchMedia("(prefers-color-scheme: dark)").matches); } catch (e2) {}
      }
    </script>
