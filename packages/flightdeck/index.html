<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <title>PilotSwarm · Flight Deck</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the theme before first paint so there is no flash. Nothing chosen means System: follow the
      // operating system. A stored explicit choice (light or dark) always wins.
      try {
        var t = localStorage.getItem("fd.theme") || "system";
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        try { document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches); } catch (e2) {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
